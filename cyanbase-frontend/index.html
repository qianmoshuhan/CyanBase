<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="/cyanbase.png">
  <title>CyanBase 青渊数字底座</title>

  <!-- 原生 loading 样式：纯 CSS，不依赖 Vue / Element Plus -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #__app_loading__ {
      position: fixed;
      inset: 0;
      z-index: 2147483647; /* 最高层级（32 位 int 最大值） */
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #__app_loading__ .loading-dots {
      display: flex;
      gap: 10px;
    }
    #__app_loading__ .loading-dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #409eff; /* Element Plus 主题蓝 */
      animation: dot-bounce 1.4s infinite ease-in-out both;
    }
    #__app_loading__ .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    #__app_loading__ .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    #__app_loading__ .loading-dots span:nth-child(3) { animation-delay: 0s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    #__app_loading__ .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: #909399;
      letter-spacing: 2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* 隐藏态：JS 移除 loading 前不会显示此选择器（仅做预留给定） */
  </style>
</head>
<body>
  <!-- 原生全屏 loading：浏览器拿到 html 即渲染，不依赖任何 JS / Vue -->
  <div id="__app_loading__">
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <div class="loading-text">正在加载中</div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
