mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: cyanbase2026secretkey666888999abcdefghijklmnopqrstuvwxyz123456
  # Access Token 有效期 2 小时（毫秒）
  accessExpire: 7200000
  # Refresh Token 有效期 7 天（毫秒）
  refreshExpire: 604800000
  # 单设备在线（true=同一用户后登录会踢掉前一个）
  singleDevice: true
  tokenHeader: Authorization
  tokenPrefix: Bearer

# ==================== AJ-Captcha 滑块验证码 ====================
# ⚠️ 此块仅作活文档保留！AJ 自动配置（com.anji.captcha.config.*）已在
#    AjCaptchaConfig.java 中排除，实际运行时 CaptchaService 引擎的配置
#    完全由 AjCaptchaConfig#captchaService() 里的 Properties 手动装配控制。
#    想改参数 → 改 AjCaptchaConfig.java，不要改这里。
aj:
  captcha:
    type: blockpuzzle                 # 滑块类型：blockpuzzle（拼图）
    aes-status: true                  # 坐标 AES 加密（前端 doCheck 里 AES.encrypt 提交密文）
    slip-offset: 15                   # X 轴像素容差（引擎默认 5px 太苛刻）
    cache-type: local                 # 引擎答案缓存：local（内存），和下方凭证 Redis 独立
    water-mark: ''                    # 右下角水印（空串 = 关闭）
    jigsaw: classpath:captcha/images/jigsaw  # 自定义底图目录（几何图），缺省用 jar 内置植物图


# ==================== 阶段八新增配置 ====================

# SpringDoc 接口文档配置
springdoc:
  enabled: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.cyan: DEBUG
    com.cyan.security.datascope.CyanDataPermissionHandler: DEBUG
    com.cyan.security.filter.JwtAuthenticationFilter: DEBUG
  file:
    name: logs/cyanbase.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      file-name-pattern: logs/cyanbase.%d{yyyy-MM-dd}.%i.log

# 全局线程池配置
thread-pool:
  core-pool-size: 10
  max-pool-size: 50
  queue-capacity: 200
  keep-alive-seconds: 60

# 允许循环依赖（临时方案，后续优化）
spring.main.allow-circular-references: true